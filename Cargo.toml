[package]
name = "s3box-sound"
version = "0.1.0"
authors = ["bjoernQ <bjoern.quentin@mobile-j.de>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { package = "esp-hal", version = "0.20.1", features = [
    "esp32s3",
] }
esp-backtrace = { version = "0.14.1", features = [
    "esp32s3",
    "panic-handler",
    "exception-handler",
    "println",
] }
esp-println = { version = "0.11.0", features = ["esp32s3"] }
esp-hal-embassy = { version = "0.3.0", features = [
    "esp32s3",
] }

es8311 = { git = "https://github.com/bjoernQ/es8311-rs", default-features = false }
embedded-hal = { version = "1.0.0" }

embassy-executor = { version = "0.6.0", package = "embassy-executor", features = [
    "task-arena-size-12288",
    "integrated-timers",
] }
embassy-time = { version = "0.3.2" }
static_cell = { version = "2.0", features = ["nightly"] }

[patch.crates-io]
#esp-hal = { path = "/projects/review/daniel/esp-hal/esp-hal" }
#esp-hal-embassy = { path = "/projects/review/daniel/esp-hal/esp-hal-embassy" }

esp-hal = { git = "https://github.com/esp-rs/esp-hal", package = "esp-hal", rev = "f50c6fc071b59c72aebe54590abc9b87ddd702b5"}
esp-hal-embassy = {  git = "https://github.com/esp-rs/esp-hal", package = "esp-hal-embassy", rev = "f50c6fc071b59c72aebe54590abc9b87ddd702b5" }